name: Add AdventureWorks workbook

on:
  push:
    branches:
      - MSIA
    paths:
      - .github/workflows/add-adventureworks-workbook.yml

permissions:
  contents: write

jobs:
  add-workbook:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out MSIA
        uses: actions/checkout@v4
        with:
          ref: MSIA

      - name: Download shared AdventureWorks workbook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests
          import zipfile

          url = "https://uncg-my.sharepoint.com/:u:/g/personal/a_noori_uncg_edu/IQDvC1W5A4ZTS6EkFwoXIC1ZAevw-DtBda2ZWbUWvkS_4QA?download=1"
          out = Path("AdventureWorks Sales.xlsx")

          r = requests.get(url, allow_redirects=True, timeout=120)
          r.raise_for_status()
          out.write_bytes(r.content)

          if not zipfile.is_zipfile(out):
              raise RuntimeError("The downloaded file is not a valid .xlsx workbook.")

          print(f"Downloaded {out} ({out.stat().st_size:,} bytes)")
          PY

      - name: Commit workbook
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "AdventureWorks Sales.xlsx"
          if git diff --cached --quiet; then
            echo "Workbook already up to date."
          else
            git commit -m "Add AdventureWorks Sales workbook"
            git push origin MSIA
          fi
