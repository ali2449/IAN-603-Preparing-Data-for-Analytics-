*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}body{overflow:hidden}button,select,textarea,input{font:inherit}.app{height:100vh;display:grid;grid-template-rows:60px minmax(0,1fr) 158px}body.cc-off .app{grid-template-rows:60px minmax(0,1fr) 112px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);z-index:5}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center}.brand small{display:block;color:var(--muted);font-size:11px}.top-actions{display:flex;gap:8px;align-items:center}.control,.nav-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer}.control.primary,.narration-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.db-status{font-size:12px;color:var(--muted)}.db-status.ready{color:var(--good)}.stage{min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:12px 18px}.slides-host{--h:calc(100vh - 60px - 158px - 24px);height:min(var(--h),787.5px);width:min(calc(var(--h)*16/9),1400px,calc(100vw - 36px));aspect-ratio:16/9;position:relative;flex:0 0 auto}body.cc-off .slides-host{--h:calc(100vh - 60px - 112px - 24px)}.slide{display:none;position:absolute;inset:0;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}.slide.active{display:block}.slide-inner{min-height:100%;padding:clamp(28px,3vw,48px);position:relative}.slide-footer{position:absolute;right:26px;bottom:18px;font-size:11px;font-weight:800;color:var(--muted)}.kicker{color:var(--primary);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}h1{f ze:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}.callout{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:13px 15px;border-radius:12px;border:1px solid var(--border);border-left:5px solid var(--primary);background:var(--surface3);font-size:14px}.callout strong{white-space:nowrap}.callout span{color:var(--text)}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface)}table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--surface2);color:var(--text);font-weight:900;text-align:left;padding:12px 14px;border-bottom:1px solid var(--border)}td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--muted);vertical-align:top}.sql-cell{border:1px solid #8a98a8;border-radius:7px;overflow:hidden;background:#1e1e1e;margin-top:10px}.sql-head{display:flex;justify-content:space-between;align-items:center;background:#31445a;color:#fff;padding:8px 11px}.sql-head small{display:block;color:#c9d5e2;font-size:10px}.sql-actions{display:flex;gap:5px}.sql-btn{border:1px solid #65798e;background:#42566d;color:#fff;border-radius:4px;padding:5px 9px;font-size:10px;font-weight:800}.sql-run{background:#2f78b7}.sql-editor{width:100%;height:275px;background:#1e1e1e;color:#d4d4d4;border:0;outline:0;resize:vertical;padding:14px 16px;font:12.5px/20px Consolas,Courier New,monospace;tab-size:4}.sql-output{min-height:45px;max-height:145px;overflow:auto;background:#fff;color:#1f2937;border-top:1px solid #aab5c1;padding:10px 12px;font:11px/1.45 Consolas,Courier New,monospace}.mini-result{overflow:auto}.mini-result table{font-size:11px;color:#1f2937}.mini-result th{background:#e8edf3;color:#23364a}.mini-result td{color:#1f2937;background:#fff}.bottombar{display:grid;grid-template-columns:auto minmax(540px,1fr) minmax(220px,320px) auto;gap:12px;align-items:center;padding:8px 14px;background:var(--surface);border-top:1px solid var(--border)}.audio-block{display:grid;gap:6px;min-width:0}.narration-controls{display:flex;align-items:center;gap:6px}.narration-btn,.narration-speed{min-height:30px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:5px 8px;font-size:10.5px;font-weight:800;cursor:pointer}.subtitle-bar{min-height:42px;display:flex;align-items:center;justify-content:center;padding:6px 18px;border:1px solid #303a45;border-radius:8px;background:#151a20;color:#fff;text-align:center;font-size:14px;font-weight:650;overflow:hidden}.subtitle-bar span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}body.cc-off .subtitle-bar{display:none}.audio-player{display:grid;grid-template-columns:auto minmax(100px,180px) minmax(150px,1fr) auto auto;align-items:center;gap:7px;border:1px solid var(--border);border-radius:9px;padding:5px 8px;background:var(--surface2)}.audio-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.audio-player.playing .audio-dot{background:var(--good)}.audio-title{font-size:10px;font-weight:850}.audio-seek{width:100%}.audio-time{font:10px ui-monospace,monospace;color:var(--muted)}.audio-play{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:7px;padding:4px 8px;font-size:10px}.bottom-nav{display:grid;gap:6px}.bottom-nav select{width:100%;min-height:30px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:11px;font-weight:750;padding:4px 7px}.bottom-progress{display:flex;align-items:center;gap:7px}.progress-track{height:6px;background:var(--border);border-radius:999px;overflow:hidden;flex:1}.progress-bar{height:100%;background:var(--primary)}.slide-count{font-size:10px;font-weight:850;color:var(--muted);min-width:45px;text-align:right}.transcript-panel{position:fixed;right:22px;bottom:122px;width:min(560px,calc(100vw - 44px));max-height:min(520px,70vh);display:none;grid-template-rows:auto minmax(0,1fr);z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:17px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}.transcript-panel.open{display:grid}.transcript-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}.transcript-body{padding:15px 17px;overflow:auto;white-space:pre-wrap;color:var(--text);font-size:14px;line-height:1.55}@media(max-width:1100px){.cols-4,.cols-5{grid-template-columns:repeat(2,1fr)}.title-layout{grid-template-columns:1fr}.title-visual{display:none}.bottombar{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto}.audio-block{grid-column:1/-1}.bottom-nav{grid-column:2;grid-row:2}.app{grid-template-rows:60px minmax(0,1fr) 188px}.slides-host{--h:calc(100vh - 60px - 188px - 24px)}}@media(max-width:760px){body{overflow:auto}.app{height:auto;grid-template-rows:auto auto auto}.stage{overflow:visible}.bottombar{grid-template-columns:1fr;position:sticky;bottom:0;z-index:20}.audio-block,.bottom-nav{grid-column:1;grid-row:auto}.two-col,.cols-2,.cols-3,.cols-4,.cols-5{grid-template-columns:1fr}.flow{flex-wrap:wrap}.arrow{display:none}.slides-host{width:calc(100vw - 20px);height:auto;aspect-ratio:auto}.slide{position:relative;height:auto;min-height:720px}}

const SEED_SQL=`DROP TABLE IF EXISTS sales;DROP TABLE IF EXISTS admissions;DROP TABLE IF EXISTS survey_responses;DROP TABLE IF EXISTS web_events;CREATE TABLE sales(order_id integer, order_date date, product text, region text, revenue numeric, quantity integer);INSERT INTO sales VALUES (1,'2026-01-05','Laptop','East',1200,1),(2,'2026-01-10','Mouse','East',80,2),(3,'2026-01-12','Keyboard','West',160,2),(4,'2026-02-01','Laptop','West',1300,1),(5,'2026-02-14','Mouse','South',90,3),(6,'2026-02-20','Monitor','East',500,1),(7,'2026-03-03','Laptop','South',1250,1),(8,'2026-03-09','Keyboard','East',100,1),(9,'2026-03-12','Monitor','West',550,1),(10,'2026-03-15','Mouse','West',60,1);CREATE TABLE admissions(subject_id integer, hadm_id integer, admit_ts timestamp, discharge_ts timestamp, diagnosis text);INSERT INTO admissions VALUES (1001,1,'2026-01-10 08:00','2026-01-14 12:00','Influenza'),(1001,2,'2026-02-01 09:00','2026-02-04 10:00','Follow-up'),(1002,3,'2026-01-20 10:00','2026-01-25 15:00','Fracture'),(1003,4,'2026-02-18 11:00','2026-02-20 10:00','Asthma'),(1003,5,'2026-03-01 12:00','2026-03-04 16:00','Asthma'),(1004,6,'2026-03-10 07:30','2026-03-11 10:30','Hypertension');CREATE TABLE survey_responses(respondent_id integer, question text, score integer);INSERT INTO survey_responses VALUES (1,'ease',4),(1,'speed',5),(1,'trust',4),(2,'ease',3),(2,'speed',4),(2,'trust',3),(3,'ease',5),(3,'speed',5),(3,'trust',4),(4,'ease',2),(4,'speed',3),(4,'trust',2);CREATE TABLE web_events(user_id integer,event_ts timestamp,event_type text);INSERT INTO web_events VALUES (1,'2026-01-01 09:00','view'),(1,'2026-01-01 09:05','click'),(1,'2026-01-01 09:20','purchase'),(2,'2026-01-02 10:00','view'),(2,'2026-01-02 10:30','click'),(3,'2026-01-03 11:00','view');`;
const S=[
{t:'Start',k:'IAN 603 · Module 13',h:'Introduction to Spark SQL',body:`<div class="title-layout"><div><span class="module-pill">IAN 603 · Module 13</span><h1>Introduction to Spark SQL</h1><p class="lead">Move familiar relational thinking into distributed analytical processing.</p><div class="topic-pills"><span>Distributed execution</span><span>Spark SQL</span><span>DataFrames</span><span>Lakehouse</span><span>Delta tables</span><span>Query plans</span></div><div class="start-actions"><button class="control primary" id="startWithNarration" type="button">Start Narration</button><button class="control" type="button" onclick="goToSlide(1)">Start Slides</button></div></div><div class="title-visual"><div class="flow"><div class="flow-step"><span>1</span><b>SQL</b><small>relational intent</small></div><div class="arrow">→</div><div class="flow-step"><span>2</span><b>Plan</b><small>optimized work</small></div><div class="arrow">→</div><div class="flow-step"><span>3</span><b>Cluster</b><small>parallel tasks</small></div><div class="arrow">→</div><div class="flow-step"><span>4</span><b>Result</b><small>validated grain</small></div></div></div></div>`,n:`Welcome to Module 13, Introduction to Spark SQL. In earlier modules, we used PostgreSQL to learn relational thinking. In this module, we keep that same thinking, but we move the execution environment to Spark. Spark SQL lets us write familiar SQL while Spark plans and executes the work across distributed data. The key question is not only whether the query is correct. We also ask what data is scanned, what has to move across workers, and what one output row represents.`},
{t:'Same ideas, different environment',k:'Start here',h:'Same SQL ideas, different execution environment',body:`<div class="cards cols-4"><div class="card"><span class="tag">Still matters</span><h3>Filters</h3><p>Reduce rows early and clearly.</p></div><div class="card"><span class="tag">Still matters</span><h3>Joins</h3><p>Connect related tables or files.</p></div><div class="card"><span class="tag">Still matters</span><h3>Aggregates</h3><p>Change grain deliberately.</p></div><div class="card"><span class="tag">New cost</span><h3>Shuffle</h3><p>Data may move across workers.</p></div></div>`,n:`Spark SQL does not erase the SQL ideas we already learned. Filters, joins, grouping, windows, NULL handling, and row grain still matter. What changes is the execution environment. In PostgreSQL, we usually think about one database engine managing tables and indexes. In Spark, the work may run across many workers and many data partitions. That means a correct query can still be expensive if it scans too much data or causes large shuffles.`},
{t:'Learning goals',k:'Start here',h:'What you should be able to do',body:`<div class="cards cols-5"><div class="card"><h3>Explain fit</h3><p>When Spark helps and when a database may be better.</p></div><div class="card"><h3>Describe execution</h3><p>Driver, executors, partitions, tasks, stages, and shuffle.</p></div><div class="card"><h3>Use Spark SQL</h3><p>Understand SQL and DataFrames as connected APIs.</p></div><div class="card"><h3>Work with tables</h3><p>Raw files, schemas, Delta tables, and lakehouse layers.</p></div><div class="card"><h3>Reason about cost</h3><p>Use a scan, filter, shuffle, output mental model.</p></div></div>`,n:`By the end of this module, you should be able to explain when distributed processing is useful, describe the basic Spark execution model, and understand how Spark SQL and DataFrames connect. You should also be able to reason about lakehouse tables, schema choices, Delta tables, query plans, partitions, and shuffles at an introductory level. The goal is practical understanding, not cluster administration.`},
{t:'Roadmap',k:'Start here',h:'Module roadmap',body:`<div class="flow"><div class="flow-step"><span>1</span><b>Why distributed?</b><small>workload fit</small></div><div class="arrow">→</div><div class="flow-step"><span>2</span><b>Spark model</b><small>driver, executors, tasks</small></div><div class="arrow">→</div><div class="flow-step"><span>3</span><b>Spark SQL</b><small>SQL + DataFrames</small></div><div class="arrow">→</div><div class="flow-step"><span>4</span><b>Lakehouse</b><small>files, tables, Delta</small></div><div class="arrow">→</div><div class="flow-step"><span>5</span><b>Performance</b><small>plans and shuffle</small></div></div>`,n:`We will start by asking why a workload might need distributed processing. Then we will introduce the Spark execution model. After that, we will connect SQL and DataFrames, discuss lakehouse and Delta concepts, and practice familiar SQL patterns. The last part of the module focuses on query plans, partitions, shuffles, and project-style reasoning.`},
{t:'Spark is not just bigger PostgreSQL',k:'Scale decision',h:'Spark is a distributed compute engine',body:`<div class="two-col"><div class="card"><h3>PostgreSQL mindset</h3><p>A database system stores and manages tables, indexes, transactions, constraints, and SQL execution inside a database platform.</p></div><div class="card"><h3>Spark mindset</h3><p>A distributed compute engine reads data from many storage systems, builds an execution plan, and runs work across workers.</p></div></div><div class="callout"><strong>Important</strong><span>A database and Spark often coexist. Spark does not replace every database use case.</span></div>`,n:`A common misunderstanding is to think of Spark as PostgreSQL but bigger. Spark is different. PostgreSQL is a database system with transactions, constraints, indexes, and stored tables. Spark is a distributed compute engine. It can query tables and files, but its strength is large-scale analytical processing. In many real architectures, a database and Spark work together rather than replacing each other.`},
{t:'When a database may be better',k:'Scale decision',h:'A conventional database is still a strong choice for many jobs',body:`<div class="cards cols-4"><div class="card"><h3>Transactions</h3><p>Frequent small writes and operational workflows.</p></div><div class="card"><h3>Point lookups</h3><p>Low-latency queries against indexed records.</p></div><div class="card"><h3>Constraints</h3><p>Strong relational integrity and write rules.</p></div><div class="card"><h3>Moderate data</h3><p>Data comfortably handled by the database platform.</p></div></div>`,n:`Spark is not always the right tool. A conventional database may be better for transactional workloads, frequent small updates, low-latency point lookups, and strict relational constraints. If the data fits comfortably in the database and the query workload is already efficient, moving to Spark may add complexity without much benefit.`},
{t:'When Spark may be better',k:'Scale decision',h:'Spark is useful for large analytical processing',body:`<div class="cards cols-4"><div class="card"><h3>Large files</h3><p>Broad scans across lakehouse files or many partitions.</p></div><div class="card"><h3>ETL / ELT</h3><p>Repeated transformations across large datasets.</p></div><div class="card"><h3>Feature prep</h3><p>Batch preparation for analytics and machine learning.</p></div><div class="card"><h3>Diverse sources</h3><p>Combine files, tables, and distributed storage.</p></div></div>`,n:`Spark becomes useful when data and computation benefit from being divided across workers. Large file-based transformations, broad scans, batch feature preparation, and analytical pipelines across different storage systems are common examples. The main benefit is parallelism, but parallelism also introduces new costs such as coordination and shuffling.`},
{t:'Distributed vocabulary',k:'Architecture',h:'Four words to recognize first',body:`<div class="cards cols-4"><div class="card"><span class="tag">Data</span><h3>Partition</h3><p>A chunk of a distributed dataset that can be processed in parallel.</p></div><div class="card"><span class="tag">Work</span><h3>Task</h3><p>A unit of work sent to an executor, often for one partition.</p></div><div class="card"><span class="tag">Plan</span><h3>Stage</h3><p>A set of tasks that can run before the next data exchange.</p></div><div class="card"><span class="tag">Cost</span><h3>Shuffle</h3><p>Redistribution of data across workers.</p></div></div>`,n:`These four words appear often in Spark. A partition is a chunk of distributed data. A task is a unit of work that runs on an executor. A stage is a group of tasks that can run before a new exchange is needed. A shuffle is the movement of data across workers. Shuffles often matter for performance because they require network and disk work.`},
{t:'Driver and executors',k:'Architecture',h:'Spark separates coordination from distributed work',body:`<div class="two-col"><div class="card"><h3>Driver</h3><p>Coordinates the application, builds the plan, schedules work, and collects selected results.</p></div><div class="card"><h3>Executors</h3><p>Run tasks over partitions, cache data when requested, and send results or intermediate data back.</p></div></div>`,n:`A Spark application has a driver and executors. The driver coordinates the application and builds the plan. Executors run tasks on data partitions. A beginner-friendly way to think about this is that the driver organizes the work and the executors perform the work. We should avoid collecting huge data back to the driver because that can create memory problems.`},
{t:'SQL to distributed plan',k:'Architecture',h:'Spark turns SQL into a plan before execution',body:`<div class="flow"><div class="flow-step"><span>1</span><b>SQL text</b><small>what you write</small></div><div class="arrow">→</div><div class="flow-step"><span>2</span><b>Logical plan</b><small>resolved tables and columns</small></div><div class="arrow">→</div><div class="flow-step"><span>3</span><b>Optimized plan</b><small>rules simplify work</small></div><div class="arrow">→</div><div class="flow-step"><span>4</span><b>Physical plan</b><small>operators and exchanges</small></div></div>`,n:`Spark SQL does not execute your text directly in one simple step. It parses the SQL, resolves tables and columns, optimizes the logical plan, and creates a physical plan. The physical plan includes operators such as scans, filters, joins, aggregates, and exchanges. Exchanges often indicate data movement.`},
{t:'Lazy evaluation',k:'Architecture',h:'Spark often builds a plan before it runs work',body:`<div class="cards cols-3"><div class="card"><h3>Transformation</h3><p>Creates a new plan step, such as filter or select.</p></div><div class="card"><h3>Action</h3><p>Triggers execution, such as show, count, collect, or write.</p></div><div class="card"><h3>Teaching idea</h3><p>Until an action happens, Spark can keep optimizing the plan.</p></div></div>`,n:`Spark uses lazy evaluation for many operations. A transformation, such as selecting columns or filtering rows, usually adds to a plan. An action, such as show, count, collect, or writing a table, triggers execution. This gives Spark time to optimize the work before actually running tasks.`},
{t:'Spark SQL and DataFrames',k:'Spark SQL',h:'Two APIs can use the same execution engine',body:`<div class="two-col"><div class="card"><h3>SQL</h3><p>Write relational logic using SELECT, FROM, WHERE, JOIN, GROUP BY, and window functions.</p></div><div class="card"><h3>DataFrame API</h3><p>Write transformations in Python, Scala, or another supported language.</p></div></div><div class="callout"><strong>Same idea</strong><span>Both can produce optimized structured query plans in Spark.</span></div>`,n:`Spark SQL and the DataFrame API are closely related. SQL expresses the logic with SQL syntax. The DataFrame API expresses transformations through code. Both can use Spark's structured execution engine. For students who already know SQL, Spark SQL is a natural entry point into distributed processing.`},
{t:'Temp views',k:'Spark SQL',h:'Temporary views connect DataFrames and SQL',body:`<div class="cards cols-3"><div class="card"><h3>Load data</h3><p>Read files or tables into a DataFrame.</p></div><div class="card"><h3>Create temp view</h3><p>Register the DataFrame with a SQL name.</p></div><div class="card"><h3>Query with SQL</h3><p>Use spark.sql or a SQL notebook cell.</p></div></div>`,n:`A common workflow is to load data into a DataFrame, register it as a temporary view, and then query it with SQL. The temporary view is not the same as a permanent database view from Module 12. It is usually session-scoped and useful inside notebooks or jobs.`},
{t:'Spark SQL notebook example',k:'Spark SQL',h:'A simple Spark workflow in a notebook',body:`<div class="sql-cell"><div class="sql-head"><div><b>Spark notebook example</b><small>Copy to Fabric or Spark, not the browser SQL engine</small></div></div><textarea class="sql-editor" readonly>df = spark.read.format('csv').option('header','true').load('Files/sales.csv')
df.createOrReplaceTempView('sales_raw')

spark.sql('''
SELECT product, SUM(revenue) AS total_revenue
FROM sales_raw
GROUP BY product
ORDER BY total_revenue DESC
''').show()</textarea><div class="sql-output">This is Spark/PySpark workflow code. Use it in a Spark notebook environment.</div></div>`,n:`Here is a simple Spark notebook workflow. A file is read into a DataFrame. The DataFrame is registered as a temporary view. Then Spark SQL queries that view. This code is not meant for the browser practice engine because it requires a real Spark session. The important idea is the connection between files, DataFrames, temporary views, and SQL.`},
{t:'Fabric workflow',k:'Fabric Lakehouse',h:'Microsoft Fabric Lakehouse workflow',body:`<div class="flow"><div class="flow-step"><span>1</span><b>Lakehouse</b><small>storage + tables</small></div><div class="arrow">→</div><div class="flow-step"><span>2</span><b>Notebook</b><small>Spark session</small></div><div class="arrow">→</div><div class="flow-step"><span>3</span><b>Spark SQL</b><small>query or transform</small></div><div class="arrow">→</div><div class="flow-step"><span>4</span><b>Delta table</b><small>curated output</small></div></div>`,n:`In Microsoft Fabric, a common workflow uses a Lakehouse, a notebook, Spark SQL, and Delta tables. You might upload or connect files, read them with Spark, create temporary views, transform data using SQL, and save curated results as tables. The same relational ideas still apply, but the environment is lakehouse-oriented.`},
{t:'Lakehouse layers',k:'Fabric Lakehouse',h:'Think in layers: files, tables, engine, consumers',body:`<div class="cards cols-4"><div class="card"><span class="tag">Storage</span><h3>Files</h3><p>CSV, Parquet, JSON, and other raw inputs.</p></div><div class="card"><span class="tag">Table layer</span><h3>Delta tables</h3><p>Managed table format with transaction log features.</p></div><div class="card"><span class="tag">Compute</span><h3>Spark</h3><p>Distributed execution over files and tables.</p></div><div class="card"><span class="tag">Use</span><h3>Reports</h3><p>Queries, dashboards, notebooks, and models.</p></div></div>`,n:`A lakehouse combines file storage with table-like access. Raw files may enter the lakehouse first. Curated outputs are often stored as Delta tables. Spark provides distributed compute over those data assets. Reports, notebooks, and models consume the prepared results. This layered thinking helps keep raw, cleaned, and analytical data separate.`},
{t:'Delta tables',k:'Fabric Lakehouse',h:'Delta tables add table behavior on top of files',body:`<div class="cards cols-4"><div class="card"><h3>Transaction log</h3><p>Tracks changes to table files.</p></div><div class="card"><h3>Schema handling</h3><p>Helps enforce and evolve table structure.</p></div><div class="card"><h3>Reliable updates</h3><p>Supports more reliable lakehouse table operations.</p></div><div class="card"><h3>SQL access</h3><p>Spark SQL can query Delta tables like tables.</p></div></div>`,n:`Delta tables add table behavior on top of data files. They use a transaction log to track table changes and support more reliable operations than plain collections of files. For this course, the key idea is that Delta tables make lakehouse data easier to query and manage as tables.`},
{t:'Raw files vs managed tables',k:'Fabric Lakehouse',h:'Raw file access and table access have different expectations',body:`<div class="two-col"><div class="card"><h3>Raw file</h3><p>Flexible and useful for ingestion, but schema may need to be inferred or supplied.</p></div><div class="card"><h3>Delta table</h3><p>Better for curated, reusable analytical data with a stable table contract.</p></div></div>`,n:`A raw file is flexible, but Spark may need to infer or be given the schema. A curated Delta table has a stronger table contract. For teaching, think of raw files as ingestion material and tables as reusable analytical assets. That is not an absolute rule, but it is a helpful workflow.`},
{t:'Schema inference caution',k:'Schema',h:'Schema inference is convenient but not always safe',body:`<div class="cards cols-3"><div class="card"><h3>Convenient</h3><p>Spark can inspect data and guess column types.</p></div><div class="card"><h3>Risk</h3><p>A small sample may guess incorrectly or treat important IDs as numbers.</p></div><div class="card"><h3>Better for production</h3><p>Use an explicit schema when the structure matters.</p></div></div>`,n:`Schema inference is convenient for exploration. Spark can look at data and guess types. But inferred types can be wrong, especially for identifiers, dates, mixed values, or sparse columns. For production workflows and important assignments, an explicit schema is often safer because it documents the expected structure.`},
{t:'Explicit schema example',k:'Schema',h:'Explicit schemas document expectations',body:`<div class="sql-cell"><div class="sql-head"><div><b>PySpark explicit schema example</b><small>Copy to Spark notebook</small></div></div><textarea class="sql-editor" readonly>from pyspark.sql.types import StructType, StructField, StringType, IntegerType, DoubleType

schema = StructType([
    StructField('order_id', IntegerType(), True),
    StructField('product', StringType(), True),
    StructField('region', StringType(), True),
    StructField('revenue', DoubleType(), True)
])

sales = spark.read.schema(schema).option('header','true').csv('Files/sales.csv')</textarea><div class="sql-output">Use explicit schemas when the expected structure is important.</div></div>`,n:`This example shows an explicit schema in PySpark. The schema states the expected column names and data types. It is more verbose than inference, but it is more transparent. In data preparation, being explicit often prevents silent mistakes later.`},
{t:'Portable SQL lab',k:'SQL practice',h:'Browser practice uses portable SQL, not a Spark cluster',body:`<div class="callout"><strong>Lab note</strong><span>The examples on this slide deck run in a small browser SQL engine so you can practice relational logic. Spark-specific code should be run in Fabric or a real Spark environment.</span></div><div class="cards cols-3"><div class="card"><h3>Practice here</h3><p>SELECT, WHERE, GROUP BY, JOIN, windows, and grain checks.</p></div><div class="card"><h3>Run in Spark</h3><p>File reading, Spark sessions, Delta operations, and cluster plans.</p></div><div class="card"><h3>Transfer idea</h3><p>The SQL thinking carries across environments.</p></div></div>`,n:`This deck includes a portable SQL practice engine in the browser. It is not a Spark cluster. We use it to practice the relational logic that will transfer to Spark SQL, such as grouping, joins, windows, and grain checks. Spark-specific file reading and Delta operations should be run in Fabric or another Spark environment.`},
{t:'Practice data',k:'SQL practice',h:'Small tables support the runnable examples',body:`<div class="table-wrap"><table><thead><tr><th>Table</th><th>Purpose</th></tr></thead><tbody><tr><td>sales</td><td>product, region, date, revenue, quantity</td></tr><tr><td>admissions</td><td>patient admissions for stay and readmission logic</td></tr><tr><td>survey_responses</td><td>long-form scores for grouping and pivot-like reasoning</td></tr><tr><td>web_events</td><td>ordered user events for sequence logic</td></tr></tbody></table></div>`,n:`The browser practice database is intentionally small. It includes sales, admissions, survey responses, and web events. These are not meant to be big-data examples. They are meant to help you practice SQL logic before running the same kind of logic in Spark.`},
{t:'Survey summary',k:'Runnable SQL',h:'Start with a simple aggregate',sql:`SELECT question,
       COUNT(*) AS responses,
       ROUND(AVG(score), 2) AS avg_score
FROM survey_responses
GROUP BY question
ORDER BY question;`,note:'Run this and verify one row per question.',n:`Here we have a simple aggregate. The query groups survey responses by question and calculates the number of responses and the average score. Run it in the browser and check the grain. One output row represents one question. In Spark SQL, the same grouping idea would apply, but the data could be distributed across many partitions.`},
{t:'Filter early',k:'Runnable SQL',h:'Filtering reduces the rows that later steps must process',sql:`SELECT product, region, revenue
FROM sales
WHERE order_date >= DATE '2026-02-01'
ORDER BY order_date, product;`,note:'Run this and notice that only February and March orders remain.',n:`This query filters sales before returning results. In Spark, filters can be especially important because they may reduce how much data needs to be processed. When data is stored in an efficient format and partitioned well, some filters can help avoid scanning unnecessary data. The teaching habit is simple: filter as early as the logic allows.`},
{t:'Group sales by product',k:'Runnable SQL',h:'Aggregation changes row grain',sql:`SELECT product,
       COUNT(*) AS order_rows,
       SUM(quantity) AS units,
       SUM(revenue) AS total_revenue
FROM sales
GROUP BY product
ORDER BY total_revenue DESC;`,note:'Run this and state the output grain.',n:`This query groups order rows by product. The output grain changes from one order row to one product. That grain change is important in PostgreSQL and in Spark. In Spark, GROUP BY can also create a shuffle because rows with the same product may need to be brought together across workers.`},
{t:'Join mindset',k:'Runnable SQL',h:'Joins connect datasets, but may increase cost',sql:`SELECT s.region,
       a.diagnosis,
       COUNT(*) AS paired_rows
FROM sales AS s
CROSS JOIN admissions AS a
WHERE s.region = 'East'
GROUP BY s.region, a.diagnosis
ORDER BY paired_rows DESC, diagnosis;`,note:'Run this as a cautionary artificial join. Notice how row counts grow.',n:`This example uses a cross join with a filter only to demonstrate that joins can multiply rows. In real Spark work, joins can be expensive because Spark may need to move data so matching keys are together. Before joining large datasets, ask whether the join keys are correct, whether the grain is controlled, and whether one side is small enough to broadcast.`},
{t:'EXPLAIN habit',k:'Runnable SQL',h:'Inspect plans instead of guessing',sql:`EXPLAIN
SELECT product,
       SUM(revenue) AS total_revenue
FROM sales
WHERE order_date >= DATE '2026-02-01'
GROUP BY product;`,note:'Run this. In Spark, EXPLAIN shows a richer distributed plan.',n:`This browser example uses EXPLAIN to build the habit of inspecting a plan. Spark EXPLAIN output is different and usually more detailed, but the habit is the same. Do not guess what the engine is doing. Inspect the planned operators and look for scans, filters, joins, aggregates, sorts, and exchanges.`},
{t:'Partitions',k:'Performance',h:'Partitions allow parallel work',body:`<div class="cards cols-3"><div class="card"><h3>One dataset</h3><p>Split into partitions.</p></div><div class="card"><h3>Many tasks</h3><p>Tasks process partitions in parallel.</p></div><div class="card"><h3>Too few or too many</h3><p>Both can hurt performance.</p></div></div>`,n:`Partitions are central to Spark parallelism. A dataset is divided into pieces, and tasks process those pieces. Too few partitions can limit parallelism. Too many small partitions can create overhead. As a beginner, you do not need to tune every partition setting, but you should understand why partitioning affects performance.`},
{t:'Partition pruning',k:'Performance',h:'Good partition columns can reduce scanning',body:`<div class="two-col"><div class="card"><h3>Good candidate</h3><p>Frequently filtered date or region column with manageable number of values.</p></div><div class="card"><h3>Poor candidate</h3><p>Unique ID or high-cardinality field that creates many tiny partitions.</p></div></div>`,n:`Partition pruning means Spark can skip reading some partitions when a filter matches the partition layout. A date column can be useful if queries often filter by date range. A unique ID is usually a poor partition column because it can create many tiny partitions. Partition design should follow query patterns.`},
{t:'Column pruning',k:'Performance',h:'Selecting fewer columns can reduce read work',body:`<div class="cards cols-3"><div class="card"><h3>Parquet / Delta</h3><p>Columnar formats can read selected columns efficiently.</p></div><div class="card"><h3>Bad habit</h3><p>SELECT * can read more than the task needs.</p></div><div class="card"><h3>Better habit</h3><p>Select only useful columns, especially early in a pipeline.</p></div></div>`,n:`Column pruning means the engine may read only needed columns, especially with columnar formats such as Parquet and Delta. This is one reason SELECT star can be costly in large analytical work. It may be fine during exploration, but production transformations should choose needed columns deliberately.`},
{t:'Shuffle',k:'Performance',h:'Shuffle means data is redistributed across workers',body:`<div class="flow"><div class="flow-step"><span>1</span><b>Before</b><small>rows spread by file partitions</small></div><div class="arrow">→</div><div class="flow-step"><span>2</span><b>Exchange</b><small>network + disk movement</small></div><div class="arrow">→</div><div class="flow-step"><span>3</span><b>After</b><small>matching keys together</small></div></div><div class="callout"><strong>Common causes</strong><span>GROUP BY, ORDER BY, DISTINCT, and many joins can introduce shuffle.</span></div>`,n:`A shuffle happens when data must be redistributed across workers. This often occurs for GROUP BY, ORDER BY, DISTINCT, and many joins. Shuffles are not always bad. Sometimes they are necessary. But they are important because they involve network and disk work. In Spark performance reasoning, always ask where shuffles occur.`},
{t:'Group by and shuffle',k:'Performance',h:'Rows with the same key must meet',body:`<div class="cards cols-3"><div class="card"><h3>Before group</h3><p>Product rows may live in many partitions.</p></div><div class="card"><h3>Shuffle</h3><p>Spark moves rows so each product group can be aggregated.</p></div><div class="card"><h3>After group</h3><p>One row per product or per grouping key.</p></div></div>`,n:`When we group by product, Spark must bring rows with the same product together. If those rows are spread across partitions, the engine needs a shuffle. This is why aggregation is not just a mathematical step. In distributed execution, it also has a data-movement cost.`},
{t:'Join cost',k:'Performance',h:'Joins can require data movement',body:`<div class="cards cols-3"><div class="card"><h3>Broadcast join</h3><p>Small table copied to workers when appropriate.</p></div><div class="card"><h3>Shuffle join</h3><p>Both sides may be redistributed by key.</p></div><div class="card"><h3>Design habit</h3><p>Filter and select useful columns before large joins.</p></div></div>`,n:`Spark has several join strategies. If one side is small, Spark may broadcast it to workers. If both sides are large, the data may need to be shuffled by join key. A practical habit is to filter rows and select needed columns before a large join, as long as doing so preserves the correct logic.`},
{t:'ORDER BY caution',k:'Performance',h:'A global ORDER BY can be expensive',body:`<div class="two-col"><div class="card"><h3>Global order</h3><p>Requires coordination so the whole result is sorted.</p></div><div class="card"><h3>Use when needed</h3><p>Reports may need ordering; intermediate big data often does not.</p></div></div>`,n:`A global ORDER BY can be expensive in Spark because the entire result needs a coordinated order. That may be necessary for a final report. It is often unnecessary in intermediate transformations. Sort only when the order is part of the actual requirement.`},
{t:'Windows in Spark SQL',k:'Advanced SQL',h:'Window concepts transfer directly',body:`<div class="cards cols-4"><div class="card"><h3>PARTITION BY</h3><p>Restart calculation for each entity.</p></div><div class="card"><h3>ORDER BY</h3><p>Define sequence.</p></div><div class="card"><h3>LAG / LEAD</h3><p>Previous and next row values.</p></div><div class="card"><h3>Frame</h3><p>Running and moving calculations.</p></div></div>`,n:`The window function concepts from Module 11 transfer to Spark SQL. PARTITION BY defines groups. ORDER BY defines sequence. LAG and LEAD provide previous and next values. Frames define running or moving calculations. In Spark, these are powerful, but they may also require sorting and data movement.`},
{t:'Readmission-style sequence',k:'Runnable SQL',h:'Use LAG to compare with the previous encounter',sql:`WITH sequenced AS (
  SELECT subject_id, hadm_id, admit_ts, discharge_ts,
         LAG(discharge_ts) OVER (
           PARTITION BY subject_id
           ORDER BY admit_ts, hadm_id
         ) AS previous_discharge
  FROM admissions
)
SELECT subject_id, hadm_id, admit_ts, previous_discharge,
       admit_ts - previous_discharge AS gap
FROM sequenced
WHERE previous_discharge IS NOT NULL
ORDER BY subject_id, admit_ts;`,note:'Run this and inspect the gap between encounters.',n:`This example uses LAG to compare an admission with the previous discharge for the same subject. The logic is the same kind of sequence analysis we used earlier. In Spark, this window query may require sorting within each subject partition. Run the query and inspect the gap column.`},
{t:'NULL semantics still matter',k:'Spark SQL',h:'Distributed execution does not remove SQL NULL logic',body:`<div class="cards cols-3"><div class="card"><h3>Missing value</h3><p>NULL still means unknown or missing.</p></div><div class="card"><h3>Comparisons</h3><p>NULL comparisons can produce unknown behavior.</p></div><div class="card"><h3>Aggregates</h3><p>Most aggregates ignore NULL values in familiar ways.</p></div></div>`,n:`Spark SQL still uses SQL-style NULL semantics. Distributed execution does not make NULL easier or less important. Missing values affect comparisons, filters, joins, and aggregates. The data-quality habits from Module 9 still apply in Spark.`},
{t:'Dates and intervals',k:'Spark SQL',h:'Temporal logic should stay explicit',body:`<div class="cards cols-3"><div class="card"><h3>Parse early</h3><p>Convert raw date strings into typed dates or timestamps.</p></div><div class="card"><h3>Use functions</h3><p>Use Spark SQL date functions appropriate to the environment.</p></div><div class="card"><h3>Validate grain</h3><p>State whether the output is event, day, month, or entity grain.</p></div></div>`,n:`Temporal preparation remains important in Spark. Parse raw strings into typed dates or timestamps. Use Spark SQL date functions appropriate to that environment. And always state the output grain. For example, one row per event is different from one row per month.`},
{t:'CTEs in Spark SQL',k:'Spark SQL',h:'CTEs are still useful for readable stages',body:`<div class="flow"><div class="flow-step"><span>1</span><b>source</b><small>raw or table</small></div><div class="arrow">→</div><div class="flow-step"><span>2</span><b>cleaned</b><small>typed columns</small></div><div class="arrow">→</div><div class="flow-step"><span>3</span><b>aggregated</b><small>new grain</small></div><div class="arrow">→</div><div class="flow-step"><span>4</span><b>final</b><small>report result</small></div></div>`,n:`Common Table Expressions are still useful in Spark SQL. They make complex logic readable by separating stages. The same rule from Module 11 applies: each stage should have a clear row meaning. In Spark, this also helps you reason about scans, filters, aggregations, and shuffles.`},
{t:'CTE query example',k:'Runnable SQL',h:'Use CTEs to stage an analytical query',sql:`WITH monthly_sales AS (
  SELECT DATE_TRUNC('month', order_date)::date AS sale_month,
         product,
         SUM(revenue) AS monthly_revenue
  FROM sales
  GROUP BY DATE_TRUNC('month', order_date)::date, product
), ranked AS (
  SELECT *,
         RANK() OVER (PARTITION BY sale_month ORDER BY monthly_revenue DESC) AS revenue_rank
  FROM monthly_sales
)
SELECT *
FROM ranked
WHERE revenue_rank <= 2
ORDER BY sale_month, revenue_rank, product;`,note:'Run this and identify each CTE grain.',n:`This query uses CTEs and a window function. The monthly sales stage has one row per month and product. The ranked stage keeps that grain and adds a rank within each month. The final SELECT keeps the top two rank groups. This is a good example of readable staged SQL that can transfer to Spark SQL.`},
{t:'Creating a managed table',k:'Lakehouse workflow',h:'Save curated results as a table',body:`<div class="sql-cell"><div class="sql-head"><div><b>Spark table creation example</b><small>Copy to Spark or Fabric notebook</small></div></div><textarea class="sql-editor" readonly>spark.sql('''
CREATE OR REPLACE TABLE curated.monthly_sales AS
SELECT date_trunc('month', order_date) AS sale_month,
       product,
       SUM(revenue) AS monthly_revenue
FROM raw.sales
GROUP BY date_trunc('month', order_date), product
''')</textarea><div class="sql-output">In Fabric or Spark, this kind of statement creates a reusable curated table.</div></div>`,n:`In a lakehouse workflow, we often save curated results as a table. This example creates a monthly sales table from raw sales data. The important design choice is the output grain: one row per month and product. In a real Spark environment, you would also think about table format, location, and refresh process.`},
{t:'Fabric SQL surfaces',k:'Fabric Lakehouse',h:'Spark SQL and T-SQL endpoints are not the same thing',body:`<div class="two-col"><div class="card"><h3>Spark notebook / Spark SQL</h3><p>Runs on Spark compute and supports Spark-specific workflows over lakehouse data.</p></div><div class="card"><h3>SQL analytics endpoint</h3><p>Provides a SQL serving surface with T-SQL style behavior for querying lakehouse tables.</p></div></div>`,n:`In Microsoft Fabric, be careful about which SQL surface you are using. A Spark notebook or Spark SQL cell runs through Spark. A SQL analytics endpoint uses a different SQL serving surface, often with T-SQL style behavior. Some syntax and capabilities differ. When code fails, first check which engine you are actually using.`},
{t:'Portability',k:'Spark SQL',h:'Portable SQL is valuable, but dialect differences remain',body:`<div class="cards cols-3"><div class="card"><h3>Usually familiar</h3><p>SELECT, WHERE, JOIN, GROUP BY, windows.</p></div><div class="card"><h3>Can differ</h3><p>Date functions, file/table commands, temporary view syntax.</p></div><div class="card"><h3>Teaching habit</h3><p>Separate relational idea from engine-specific syntax.</p></div></div>`,n:`A lot of SQL knowledge transfers across PostgreSQL and Spark SQL, especially core relational patterns. But dialect differences remain. Date functions, file-reading commands, table creation, and temporary view syntax can differ. A strong learner separates the relational idea from the engine-specific syntax used to express it.`},
{t:'Reading files in Spark',k:'Lakehouse workflow',h:'File reading is an engine-specific step',body:`<div class="sql-cell"><div class="sql-head"><div><b>Spark file-read examples</b><small>Copy to Spark notebook</small></div></div><textarea class="sql-editor" readonly>sales_csv = spark.read.option('header','true').csv('Files/sales.csv')
sales_parquet = spark.read.parquet('Files/sales_parquet')
sales_delta = spark.read.format('delta').load('Tables/sales_delta')</textarea><div class="sql-output">These commands require Spark and a compatible storage path.</div></div>`,n:`Reading files is one of the places where Spark-specific syntax appears. CSV, Parquet, and Delta each have their own read patterns. After the data becomes a DataFrame or table, the relational SQL logic becomes more familiar. Do not confuse the file-ingestion step with the SQL analysis step.`},
{t:'Project overview',k:'Project',h:'Build a Spark SQL sales and readmission mini-pipeline',body:`<div class="cards cols-4"><div class="card"><h3>1. Inspect</h3><p>Review source schema and row grain.</p></div><div class="card"><h3>2. Clean</h3><p>Cast dates, select useful columns, and filter invalid rows.</p></div><div class="card"><h3>3. Summarize</h3><p>Create monthly product revenue.</p></div><div class="card"><h3>4. Validate</h3><p>Compare row counts, totals, and output grain.</p></div></div>`,n:`The project asks students to build a small Spark SQL pipeline. First, inspect the source schema and grain. Second, clean and type the needed columns. Third, summarize monthly product revenue or readmission intervals. Finally, validate output grain and totals. In Spark, validation is still essential because distributed execution can make mistakes expensive.`},
{t:'Project step: inspect',k:'Project',h:'Start by inspecting schema and sample rows',body:`<div class="cards cols-3"><div class="card"><h3>printSchema</h3><p>Check column names and types.</p></div><div class="card"><h3>show</h3><p>Inspect a few records.</p></div><div class="card"><h3>count carefully</h3><p>Counts trigger work, so use them intentionally.</p></div></div>`,n:`The first project step is inspection. In Spark, printSchema helps you see column types. show displays sample records. count can be useful, but remember that it triggers work. Use it intentionally. Before writing transformations, know what the raw data looks like and what one row represents.`},
{t:'Project step: curate',k:'Project',h:'Create a curated analytical table',body:`<div class="cards cols-3"><div class="card"><h3>Typed fields</h3><p>Dates and numeric values should have useful types.</p></div><div class="card"><h3>Useful columns</h3><p>Keep columns needed for the downstream task.</p></div><div class="card"><h3>Document grain</h3><p>State what one row in the curated table means.</p></div></div>`,n:`The curated table should not just be a copy of the raw data. It should have useful types, deliberate columns, and a documented row grain. For example, a monthly sales table may have one row per product and month. A readmission table may have one row per repeat admission.`},
{t:'Project validation',k:'Project',h:'Validate before trusting the output',body:`<div class="table-wrap"><table><thead><tr><th>Check</th><th>Question</th></tr></thead><tbody><tr><td>Row grain</td><td>What does one row represent?</td></tr><tr><td>Totals</td><td>Do additive totals match the source when expected?</td></tr><tr><td>Nulls</td><td>Were missing values preserved or filtered intentionally?</td></tr><tr><td>Plan</td><td>Are there obvious unnecessary scans or shuffles?</td></tr></tbody></table></div>`,n:`Validation is not optional. State the row grain. Compare totals when the measure is additive. Check whether NULL values were preserved or filtered intentionally. Inspect the plan for unnecessary scans or shuffles. A pipeline is stronger when the result is both correct and explainable.`},
{t:'Recognition checkpoint',k:'Assessment',h:'Can you connect the requirement to the Spark concept?',body:`<div class="cards cols-5"><div class="card"><h3>Large lake files</h3><p>Distributed scan</p></div><div class="card"><h3>Group by key</h3><p>Likely shuffle</p></div><div class="card"><h3>Previous event</h3><p>LAG window</p></div><div class="card"><h3>Reusable curated output</h3><p>Delta table</p></div><div class="card"><h3>Plan inspection</h3><p>EXPLAIN</p></div></div>`,n:`Use this checkpoint to connect requirements with concepts. Large lake files suggest distributed scanning. Grouping by a key may create a shuffle. Previous-event analysis suggests LAG. A reusable curated output may be stored as a Delta table. Plan inspection begins with EXPLAIN. These mappings help you choose the right Spark SQL pattern.`},
{t:'Assessment starter',k:'Assessment',h:'Complete a monthly revenue query',sql:`-- Complete the query.
-- Goal: one row per product and month.
-- Include sale_month, product, order_count, total_revenue.

SELECT
    DATE_TRUNC('month', order_date)::date AS sale_month,
    product,
    COUNT(*) AS order_count,
    SUM(revenue) AS total_revenue
FROM sales
GROUP BY DATE_TRUNC('month', order_date)::date, product
ORDER BY sale_month, product;`,note:'Run this, then explain the output grain and what would likely shuffle in Spark.',n:`The assessment starter asks for one row per product and month. The browser version is already complete so you can run it and inspect the result. In a student assignment, you can remove part of the SELECT or GROUP BY and ask students to finish it. After running it, explain the output grain and why a Spark version may need a shuffle for the grouping keys.`},
{t:'Object decision guide',k:'Decision guide',h:'Choose where the work belongs',body:`<div class="table-wrap"><table><thead><tr><th>Need</th><th>Likely place</th></tr></thead><tbody><tr><td>Transactional update or constraint-heavy workflow</td><td>database</td></tr><tr><td>Large file transformation</td><td>Spark</td></tr><tr><td>Reusable curated lakehouse table</td><td>Delta table</td></tr><tr><td>Small dashboard query over indexed table</td><td>database or SQL endpoint</td></tr><tr><td>Batch feature preparation</td><td>Spark job or notebook</td></tr></tbody></table></div>`,n:`This decision guide helps you choose where work belongs. Transactional workflows often belong in a database. Large file transformations often fit Spark. Reusable lakehouse outputs often become Delta tables. Small dashboard queries may fit a database or SQL endpoint. Batch feature preparation may fit Spark. The best choice depends on workload, freshness, governance, and scale.`},
{t:'Module 13 takeaways',k:'Closure',h:'The Spark SQL habits to keep',body:`<div class="cards cols-3"><div class="card"><span class="tag">1</span><h3>Keep relational thinking</h3><p>Filters, joins, grouping, windows, NULLs, and grain still matter.</p></div><div class="card"><span class="tag">2</span><h3>Think distributed cost</h3><p>Ask what is scanned, shuffled, sorted, or collected.</p></div><div class="card"><span class="tag">3</span><h3>Use tables deliberately</h3><p>Raw files, temporary views, and Delta tables serve different purposes.</p></div><div class="card"><span class="tag">4</span><h3>Inspect plans</h3><p>Use EXPLAIN and look for exchanges and unnecessary work.</p></div><div class="card"><span class="tag">5</span><h3>Validate outputs</h3><p>Check grain, totals, NULL policy, and row counts.</p></div><div class="card"><span class="tag">6</span><h3>Match tool to workload</h3><p>Spark is powerful, but not every query needs it.</p></div></div>`,n:`These are the main habits from Module 13. Keep the relational thinking you built earlier. Add distributed cost awareness. Use raw files, temporary views, and Delta tables deliberately. Inspect plans. Validate outputs. And match the tool to the workload instead of assuming Spark is always better.`},
{t:'Next: Module 14',k:'Closure',h:'Next: Final Project',body:`<div class="title-layout"><div><span class="module-pill">Next module</span><h1>Final Project</h1><p class="lead">Bring together PostgreSQL, data preparation, SQL analysis, and communication into a complete analytics workflow.</p><div class="topic-pills"><span>Problem framing</span><span>Data preparation</span><span>SQL analysis</span><span>Validation</span><span>Presentation</span></div></div><div class="title-visual"><div class="flow"><div class="flow-step"><span>1</span><b>Question</b></div><div class="arrow">→</div><div class="flow-step"><span>2</span><b>Data</b></div><div class="arrow">→</div><div class="flow-step"><span>3</span><b>Analysis</b></div><div class="arrow">→</div><div class="flow-step"><span>4</span><b>Story</b></div></div></div></div>`,n:`Module 14 is the final project. You will bring together the course skills: understanding data, preparing it, writing SQL, validating outputs, and communicating results. The Spark SQL ideas from this module give you one more option for thinking about analytical scale, but the core habits remain the same: know your data, state the grain, validate your work, and explain your decisions.`}

function htmlEscape(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
const host=document.getElementById('slidesHost');S.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide'+(i===0?' active':'');sec.dataset.title=s.t;let body=s.body||`<h2>${s.h}</h2>${s.p?`<p class="lead">${s.p}</p>`:''}`;if(s.sql){body+=`<div class="sql-cell"><div class="sql-head"><div><b>${s.t}</b><small>Portable SQL practice</small></div><div class="sql-actions"><button class="sql-btn sql-run" type="button">Run</button><button class="sql-btn sql-reset" type="button">Reset</button><button class="sql-btn sql-copy" type="button">Copy</button></div></div><textarea class="sql-editor" spellcheck="false">${htmlEscape(s.sql)}</textarea><div class="sql-output">${s.note||'Run the query and inspect the output.'}</div></div>`}sec.innerHTML=`<div class="slide-inner"><div class="kicker">${s.k}</div>${i===0?body:`<h2>${s.h}</h2>${body}`}<div class="slide-footer">IAN 603 · Module 13 · Slide ${i+1}</div></div>`;host.appendChild(sec)});
const slides=[...document.querySelectorAll('.slide')],slideSelect=document.getElementById('slideSelect'),slideCount=document.getElementById('slideCount'),slideProgress=document.getElementById('slideProgress');let current=0;slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s.dataset.title;slideSelect.appendChild(o)});
function goToSlide(i){current=Math.max(0,Math.min(i,slides.length-1));slides.forEach((s,j)=>s.classList.toggle('active',j===current));slideSelect.value=current;slideCount.textContent=(current+1)+' / '+slides.length;slideProgress.style.width=(((current+1)/slides.length)*100)+'%';document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===slides.length-1;slides[current].scrollTop=0;renderNarration(current);if(narrationStarted&&narrationEnabled)playCurrentNarration()}window.goToSlide=goToSlide;
document.getElementById('prevBtn').onclick=()=>goToSlide(current-1);document.getElementById('nextBtn').onclick=()=>goToSlide(current+1);slideSelect.onchange=()=>goToSlide(Number(slideSelect.value));document.getElementById('themeBtn').onclick=e=>{document.body.classList.toggle('dark');e.target.textContent=document.body.classList.contains('dark')?'Light mode':'Dark mode'};document.getElementById('fullBtn').onclick=async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.()};document.addEventListener('keydown',e=>{const el=document.activeElement,tag=el?.tagName?.toLowerCase();if(tag==='textarea'||tag==='input'||tag==='select'||tag==='button'||el?.isContentEditable)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();goToSlide(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goToSlide(current-1)}});
let db=null,dbPromise=null;async function initDb(){if(db)return db;if(!dbPromise){dbPromise=(async()=>{const mod=await import('https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.4/dist/index.js');db=await mod.PGlite.create();await db.exec(SEED_SQL);document.getElementById('dbStatus').textContent='Portable SQL ready';document.getElementById('dbStatus').classList.add('ready');return db})().catch(e=>{document.getElementById('dbStatus').textContent='Portable SQL unavailable';throw e})}return dbPromise}
function renderResult(results){const arr=Array.isArray(results)?results:[results];const q=[...arr].reverse().find(r=>Array.isArray(r?.rows));if(!q)return'Executed successfully.';if(!q.rows.length)return'Query ran successfully. 0 rows returned.';const cols=q.fields?.map(f=>f.name)||Object.keys(q.rows[0]);return'<div class="mini-result"><table><thead><tr>'+cols.map(c=>'<th>'+htmlEscape(c)+'</th>').join('')+'</tr></thead><tbody>'+q.rows.slice(0,80).map(r=>'<tr>'+cols.map(c=>'<td>'+htmlEscape(r[c]??'NULL')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
document.querySelectorAll('.sql-cell').forEach(box=>{const ta=box.querySelector('.sql-editor'),out=box.querySelector('.sql-output'),orig=ta?.value||'';box.querySelector('.sql-run')?.addEventListener('click',async()=>{out.textContent='Running...';try{const d=await initDb();const r=await d.exec(ta.value);out.innerHTML=renderResult(r)}catch(e){out.textContent='SQL error:\n'+(e?.message||String(e))}});box.querySelector('.sql-reset')?.addEventListener('click',()=>{ta.value=orig;out.textContent='Query reset. Run it when ready.'});box.querySelector('.sql-copy')?.addEventListener('click',async e=>{await navigator.clipboard.writeText(ta.value);e.target.textContent='Copied';setTimeout(()=>e.target.textContent='Copy',900)})});
const audio=new Audio();audio.preload='metadata';let narrationStarted=false,narrationEnabled=true,currentCues=[],activeCueIndex=-1,captionLoadToken=0;const subtitleText=document.getElementById('subtitleText'),ccToggle=document.getElementById('ccToggle');let state={ccEnabled:true};try{state={...state,...(JSON.parse(localStorage.getItem('ian603_module13_presentation'))||{})}}catch(e){}function applyCC(){const on=state.ccEnabled!==false;document.body.classList.toggle('cc-off',!on);ccToggle.textContent=on?'CC On':'CC Off';ccToggle.setAttribute('aria-pressed',on?'true':'false');if(!on)subtitleText.textContent=''}ccToggle.onclick=()=>{state.ccEnabled=!(state.ccEnabled!==false);localStorage.setItem('ian603_module13_presentation',JSON.stringify(state));applyCC()};applyCC();function sentences(t){return String(t||'').replace(/\s+/g,' ').trim().split(/(?<=[.!?])\s+/).filter(Boolean)}function fmt(v){if(!Number.isFinite(v)||v<0)return'0:00';return Math.floor(v/60)+':'+Math.floor(v%60).toString().padStart(2,'0')}function vttTime(v){const p=String(v||'').trim().replace(',','.').split(':').map(Number);if(p.length===3)return p[0]*3600+p[1]*60+p[2];if(p.length===2)return p[0]*60+p[1];return p[0]||0}function parseVtt(t){const cues=[];String(t||'').replace(/\r/g,'').split(/\n\s*\n/).forEach(b=>{const l=b.split('\n').filter(Boolean),i=l.findIndex(x=>x.includes('-->'));if(i<0)return;const p=l[i].split('-->');if(p.length!==2)return;const text=l.slice(i+1).join(' ').replace(/<[^>]+>/g,'').trim();if(text)cues.push({start:vttTime(p[0]),end:vttTime(p[1]),text})});return cues}function fallback(t){return sentences(t).map(text=>({start:null,end:null,text}))}function resetSub(){activeCueIndex=-1;subtitleText.textContent=''}
async function loadCaptions(i,token){const src=new URL('./captions/module13_slide_'+String(i+1).padStart(2,'0')+'.vtt',document.baseURI).href;try{const res=await fetch(src,{cache:'no-store'});if(!res.ok)throw new Error('missing');const cues=parseVtt(await res.text());if(!cues.length)throw new Error('empty');if(token!==captionLoadToken||i!==current)return;currentCues=cues;resetSub();document.getElementById('transcriptBody').textContent=cues.map(c=>c.text).join(' ')}catch(e){if(token!==captionLoadToken||i!==current)return;currentCues=fallback(S[i].n);resetSub();document.getElementById('transcriptBody').textContent=S[i].n}}
function prepareAudio(i){audio.pause();audio.src=new URL('./audio/module13_slide_'+String(i+1).padStart(2,'0')+'.mp3',document.baseURI).href;audio.load();document.getElementById('audioTitle').textContent='Slide '+(i+1)+' audio ready';document.getElementById('audioSeek').value='0';document.getElementById('audioTime').textContent='0:00 / 0:00'}function renderNarration(i){const token=++captionLoadToken;currentCues=fallback(S[i].n);resetSub();document.getElementById('transcriptTitle').textContent='Slide '+(i+1)+' Narration - '+S[i].t;document.getElementById('transcriptBody').textContent=S[i].n;prepareAudio(i);loadCaptions(i,token)}async function playCurrentNarration(){narrationStarted=true;narrationEnabled=true;document.getElementById('narrationToggle').textContent='Narration On';audio.playbackRate=Number(document.getElementById('speedSelect').value||1);try{await audio.play();document.getElementById('audioTitle').textContent='Playing Slide '+(current+1);document.getElementById('startNarration').textContent='Narration Started'}catch(e){document.getElementById('audioTitle').textContent='Audio not found for Slide '+(current+1)}}
document.getElementById('startNarration').onclick=playCurrentNarration;document.addEventListener('click',e=>{if(e.target&&e.target.id==='startWithNarration')playCurrentNarration()});document.getElementById('narrationToggle').onclick=e=>{narrationEnabled=!narrationEnabled;e.target.textContent=narrationEnabled?'Narration On':'Narration Off';if(!narrationEnabled)audio.pause();else if(narrationStarted)playCurrentNarration()};document.getElementById('audioPlay').onclick=()=>{narrationStarted=true;if(audio.paused)playCurrentNarration();else audio.pause()};document.getElementById('speedSelect').onchange=e=>audio.playbackRate=Number(e.target.value||1);document.getElementById('audioSeek').oninput=e=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*(Number(e.target.value)/100)};audio.onplay=()=>{document.getElementById('audioPlayer').classList.add('playing');document.getElementById('audioPlay').textContent='Pause'};audio.onpause=()=>{document.getElementById('audioPlayer').classList.remove('playing');document.getElementById('audioPlay').textContent='Play'};audio.ontimeupdate=()=>{const d=Number.isFinite(audio.duration)?audio.duration:0,t=audio.currentTime||0;document.getElementById('audioSeek').value=d?String((t/d)*100):'0';document.getElementById('audioTime').textContent=fmt(t)+' / '+fmt(d);if(state.ccEnabled!==false&&currentCues.length){let idx=-1;const timed=currentCues.some(c=>Number.isFinite(c.start)&&Number.isFinite(c.end));if(timed)idx=currentCues.findIndex(c=>t>=c.start&&t<c.end);else if(d)idx=Math.min(currentCues.length-1,Math.floor((t/d)*currentCues.length));if(idx!==activeCueIndex){activeCueIndex=idx;subtitleText.textContent=idx>=0?currentCues[idx].text:''}}};audio.onended=()=>{document.getElementById('audioPlayer').classList.remove('playing');document.getElementById('audioPlay').textContent='Play';document.getElementById('audioTitle').textContent='Slide '+(current+1)+' complete';subtitleText.textContent=''};document.getElementById('transcriptBtn').onclick=()=>document.getElementById('transcriptPanel').classList.toggle('open');document.getElementById('transcriptClose').onclick=()=>document.getElementById('transcriptPanel').classList.remove('open');goToSlide(0);initDb().catch(()=>{});
