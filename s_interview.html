<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IAN 603 | SQL Mock Interview</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#19364e;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#173d5d;color:white;padding:24px max(18px,calc((100vw - 900px)/2))}header h1{margin:5px 0}main{max-width:900px;margin:25px auto;padding:0 18px}.panel{background:white;border:1px solid #d9e3ec;border-radius:14px;padding:22px;margin:15px 0;box-shadow:0 3px 12px #153b5b0b}button,select{font:inherit;padding:10px 15px;border:1px solid #b8c9d8;border-radius:9px;background:white;cursor:pointer}button.primary{background:#1764a0;color:white;border-color:#1764a0}button:disabled{opacity:.5;cursor:not-allowed}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.muted{color:#617489}.option{display:block;border:1px solid #d6e0e9;border-radius:9px;padding:11px;margin:9px 0;cursor:pointer}.option:has(input:checked){border-color:#1764a0;background:#eff7ff}.token{margin:5px;background:#e8f1f9}.slot{display:block;width:100%;margin:7px 0;text-align:left;min-height:42px}.selected{outline:3px solid #1764a0}textarea{width:100%;min-height:160px;background:#142437;color:#e9f5ff;font:15px/1.6 ui-monospace,monospace;border-radius:9px;padding:15px}.good{color:#127047}.bad{color:#b02d32}.feedback{padding:12px;border-radius:8px;background:#f2f5f8;margin:10px 0}.hidden{display:none}.pill{display:inline-block;border-radius:50px;padding:5px 12px;background:#e7eef5}.bar{height:8px;background:#e2e9f0;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#1764a0;transition:width .2s}@media(max-width:600px){.panel{padding:16px}header{padding:20px}}
</style></head><body><header><div>IAN 603 · Preparing Data for Analytics</div><h1>SQL Mock Interview</h1><div>Randomized MCQ · Drag & drop · Short SQL code</div></header><main><section id="setup" class="panel"><h2>Start a mock interview</h2><p class="muted">Every attempt draws a fresh random selection and shuffles question order and MCQ choices. Feedback and explanations appear after you submit the entire interview.</p><div class="controls"><label>Questions <select id="count"><option value="5">5</option><option value="10" selected>10</option><option value="16">All 16</option></select></label><button class="primary" id="start">Start new mock</button></div></section><section id="exam" class="hidden"><div class="panel"><div class="controls"><strong id="status"></strong><span class="pill" id="answered"></span></div><div class="bar"><div id="progress"></div></div></div><div id="questions"></div><div class="panel controls"><button class="primary" id="submit">Submit interview</button><button id="restart">New random mock</button></div></section><section id="results" class="panel hidden"></section></main><script>
const bank=[{"t":"mcq","q":"Which clause filters rows before grouping?","o":["WHERE","HAVING","ORDER BY","GROUP BY"],"a":0,"e":"WHERE filters rows before GROUP BY."},{"t":"mcq","q":"What does COUNT(*) count?","o":["Only non-NULL values","All rows","Distinct values only","Numeric values"],"a":1,"e":"COUNT(*) counts all rows."},{"t":"mcq","q":"Which join preserves all rows from the left table?","o":["INNER JOIN","CROSS JOIN","LEFT JOIN","RIGHT JOIN"],"a":2,"e":"LEFT JOIN retains unmatched left rows."},{"t":"mcq","q":"Which clause filters aggregated groups?","o":["WHERE","HAVING","LIMIT","DISTINCT"],"a":1,"e":"HAVING filters groups after aggregation."},{"t":"mcq","q":"What does COALESCE(value, 0) return when value is NULL?","o":["NULL","0","FALSE","An error"],"a":1,"e":"COALESCE returns the first non-NULL value."},{"t":"mcq","q":"Which function assigns a unique sequential row number?","o":["RANK()","DENSE_RANK()","ROW_NUMBER()","SUM()"],"a":2,"e":"ROW_NUMBER() gives a unique sequence within its window."},{"t":"mcq","q":"Which keyword introduces a common table expression?","o":["WITH","USING","HAVING","OVER"],"a":0,"e":"WITH defines a CTE."},{"t":"mcq","q":"What does DISTINCT do?","o":["Sorts results","Removes duplicate result rows","Groups by all columns","Deletes duplicates from a table"],"a":1,"e":"DISTINCT removes duplicates from the query result."},{"t":"mcq","q":"Which PostgreSQL syntax counts rows conditionally?","o":["COUNT(WHERE condition)","COUNT(*) FILTER (WHERE condition)","FILTER COUNT(*)","COUNT(*) HAVING condition"],"a":1,"e":"FILTER is PostgreSQL conditional aggregation syntax."},{"t":"mcq","q":"Which function returns the previous row's value in a window?","o":["LEAD","LAG","ROW_NUMBER","COALESCE"],"a":1,"e":"LAG accesses a preceding row."},{"t":"drag","q":"Arrange SQL clauses in their written order.","p":["SELECT","FROM","WHERE","GROUP BY","HAVING","ORDER BY"],"e":"The standard SQL clause order starts SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY."},{"t":"drag","q":"Arrange the data preparation workflow.","p":["Inspect raw data","Handle missing values","Join related tables","Aggregate metrics","Validate output"],"e":"Inspect, clean, join, aggregate, and validate."},{"t":"drag","q":"Arrange query processing steps.","p":["Filter input rows","Group rows","Calculate aggregates","Filter groups","Sort output"],"e":"WHERE precedes grouping; HAVING follows aggregation."},{"t":"code","q":"Select every column from patients.","s":"SELECT\nFROM patients;","r":"\\bselect\\s+\\*\\s+from\\s+patients\\b","sample":"SELECT * FROM patients;","e":"Use SELECT * FROM patients."},{"t":"code","q":"Count admissions per patient_id, alias admission_count.","s":"SELECT\nFROM admissions\nGROUP BY ;","r":"\\bcount\\s*\\(\\s*\\*\\s*\\).*\\bfrom\\s+admissions\\b.*\\bgroup\\s+by\\s+patient_id\\b","sample":"SELECT patient_id, COUNT(*) AS admission_count FROM admissions GROUP BY patient_id;","e":"Group by patient_id and use COUNT(*)."},{"t":"code","q":"Return patients ordered by patient_id.","s":"SELECT *\nFROM patients\nORDER BY ;","r":"\\bselect\\s+\\*\\s+from\\s+patients\\s+order\\s+by\\s+patient_id\\b","sample":"SELECT * FROM patients ORDER BY patient_id;","e":"Use ORDER BY patient_id."}];let exam=[],answers={},submitted=false,selected=null;const $=id=>document.getElementById(id),escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;'}[c]));function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){const count=Number($('count').value);exam=shuffle(bank).slice(0,count).map((q,i)=>({...q,id:i,choices:q.t==='mcq'?shuffle(q.o.map((v,j)=>({v,j}))):null,parts:q.t==='drag'?shuffle(q.p.map((v,j)=>({v,j}))):null}));answers={};submitted=false;$('setup').classList.add('hidden');$('results').classList.add('hidden');$('exam').classList.remove('hidden');render();window.scrollTo(0,0)}function render(){let html='';exam.forEach((q,i)=>{let a=answers[i]||{};html+='<article class="panel"><span class="pill">'+q.t.toUpperCase()+'</span><h3>'+(i+1)+'. '+escapeHtml(q.q)+'</h3>';if(q.t==='mcq')q.choices.forEach((c,j)=>html+='<label class="option"><input type="radio" name="q'+i+'" value="'+c.j+'" '+(a.choice===c.j?'checked':'')+' '+(submitted?'disabled':'')+'> '+escapeHtml(c.v)+'</label>');if(q.t==='code')html+='<textarea data-code="'+i+'" '+(submitted?'disabled':'')+' spellcheck="false">'+escapeHtml(a.code??q.s)+'</textarea><p class="muted">Code is checked against expected SQL patterns, not executed in PostgreSQL.</p>';if(q.t==='drag'){html+='<p class="muted">Click an item, then click a numbered slot. You can also drag items on desktop.</p>';let used=a.order||[];q.parts.filter(c=>!used.includes(c.j)).forEach(c=>html+='<button class="token" draggable="'+(!submitted)+'" data-token="'+i+':'+c.j+'">'+escapeHtml(c.v)+'</button>');for(let k=0;k<q.p.length;k++){let idx=used[k];html+='<button class="slot" '+(submitted?'disabled':'')+' data-slot="'+i+':'+k+'">'+(k+1)+'. '+(idx===undefined?'Drop or select an item':escapeHtml(q.p[idx]))+'</button>'}}if(submitted){let ok=grade(q,a);html+='<div class="feedback"><strong class="'+(ok?'good':'bad')+'">'+(ok?'✓ Correct':'✕ Incorrect')+'</strong><p>'+escapeHtml(q.e)+'</p>';if(q.t==='mcq')html+='<p><b>Correct answer:</b> '+escapeHtml(q.o[q.a])+'</p>';if(q.t==='drag')html+='<p><b>Correct order:</b> '+escapeHtml(q.p.join(' → '))+'</p>';if(q.t==='code')html+='<p><b>Example:</b> <code>'+escapeHtml(q.sample)+'</code></p>';html+='</div>'}html+='</article>'});$('questions').innerHTML=html;update()}function grade(q,a){if(q.t==='mcq')return a.choice===q.a;if(q.t==='drag')return (a.order||[]).length===q.p.length&&a.order.every((v,i)=>v===i);return new RegExp(q.r,'i').test((a.code||'').replace(/--[^\n]*/g,' ').replace(/\s+/g,' ').trim())}function update(){let n=exam.filter((q,i)=>{let a=answers[i]||{};return q.t==='mcq'?a.choice!==undefined:q.t==='drag'?(a.order||[]).length===q.p.length:!!a.code?.trim()}).length;$('status').textContent=exam.length+' questions';$('answered').textContent=n+' answered';$('progress').style.width=(100*n/exam.length)+'%'}$('start').onclick=start;$('restart').onclick=()=>{if(confirm('Start a new randomized interview?'))start()};$('questions').onchange=e=>{if(submitted)return;if(e.target.type==='radio'){let i=Number(e.target.name.slice(1));answers[i]={...(answers[i]||{}),choice:Number(e.target.value)};update()}};$('questions').oninput=e=>{if(submitted)return;if(e.target.dataset.code!==undefined){let i=Number(e.target.dataset.code);answers[i]={...(answers[i]||{}),code:e.target.value};update()}};function place(i,k,j){let a=answers[i]||{},order=[...(a.order||[])].filter(v=>v!==j);if(order[k]!==undefined)order.splice(k,1);order.splice(k,0,j);answers[i]={...a,order};selected=null;render()}$('questions').onclick=e=>{if(submitted)return;let t=e.target.closest('[data-token]'),s=e.target.closest('[data-slot]');if(t){selected=t.dataset.token;document.querySelectorAll('[data-token]').forEach(el=>el.classList.toggle('selected',el.dataset.token===selected))}else if(s){let [i,k]=s.dataset.slot.split(':').map(Number);if(selected){let [from,j]=selected.split(':').map(Number);if(from===i)place(i,k,j)}else{let a=answers[i]||{},order=[...(a.order||[])];order.splice(k,1);answers[i]={...a,order};render()}}};$('questions').ondragstart=e=>{let t=e.target.closest('[data-token]');if(t)e.dataTransfer.setData('text/plain',t.dataset.token)};$('questions').ondragover=e=>{if(e.target.closest('[data-slot]'))e.preventDefault()};$('questions').ondrop=e=>{let s=e.target.closest('[data-slot]');if(!s)return;e.preventDefault();let v=e.dataTransfer.getData('text/plain');if(!v)return;let [i,k]=s.dataset.slot.split(':').map(Number),[from,j]=v.split(':').map(Number);if(i===from)place(i,k,j)};$('submit').onclick=()=>{if(!confirm('Submit your interview and reveal the correct and incorrect answers?'))return;document.querySelectorAll('[data-code]').forEach(el=>{let i=Number(el.dataset.code);answers[i]={...(answers[i]||{}),code:el.value}});submitted=true;let score=exam.filter((q,i)=>grade(q,answers[i]||{})).length;$('results').innerHTML='<h2>Interview results</h2><h1>'+score+' / '+exam.length+' correct ('+Math.round(100*score/exam.length)+'%)</h1><p>Review each question below to see whether your answer was correct and read the explanation.</p><button class="primary" id="again">Try another random mock</button>';$('results').classList.remove('hidden');render();$('again').onclick=start;$('results').scrollIntoView({behavior:'smooth'})};
</script></body></html>
